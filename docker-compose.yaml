services:
  db:
    image: postgres:16-alpine
    container_name: erp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      POSTGRES_DB: ${DB_NAME:-db_erp_printing}
    # ports:
    #   - "${DB_PORT:-5432}:5432" # Tutup port publik, akses via internal network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - erp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-postgres} -d $${DB_NAME:-db_erp_printing}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: ghcr.io/bagusyanuar/erp-digital-printing-be:latest
    container_name: erp-app
    restart: unless-stopped
    env_file: env/backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      # Override DB_PASSWORD jika tidak ada di .env, default tetap password123
      DB_PASSWORD: ${DB_PASSWORD:-password123}
    volumes:
      - ./.logs:/app/.logs
      - ./configs:/app/configs:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - erp-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: erp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/cert:/etc/nginx/cert:ro
    depends_on:
      - app
    networks:
      - erp-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  erp-network:
    driver: bridge

volumes:
  postgres_data:
